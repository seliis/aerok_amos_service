publish_to: none
version: 0.0.2

name: aerok_amos_service
description: ""

environment:
  sdk: ^3.7.0

dependencies:
  file_picker: ^9.0.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_dotenv: ^5.2.1
  go_router: ^14.8.1
  http: ^1.3.0
  intl: ^0.20.2
  json_theme: ^8.0.0+2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/themes/aerok.json

  fonts:
    - family: NanumSquareNeo
      fonts:
        - asset: assets/fonts/NanumSquareNeo-aLt.ttf
          weight: 200
        - asset: assets/fonts/NanumSquareNeo-bRg.ttf
          weight: 400
        - asset: assets/fonts/NanumSquareNeo-dEb.ttf
          weight: 700
    - family: CascadiaCode
      fonts:
        - asset: assets/fonts/CascadiaCode-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/CascadiaCode-Regular.ttf
          weight: 400
        - asset: assets/fonts/CascadiaCode-Bold.ttf
          weight: 700